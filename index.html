<!DOCTYPE html>

<style>
  :root {
    color-scheme: light;
    --navy:#1c2b4a;
    --navy-2:#2a3f66;
    --blue:#2f6fed;
    --blue-l:#eaf1ff;
    --gray:#6b7280;
    --gray-l:#f4f5f7;
    --border:#e4e7ee;
    --bg:#f7f8fb;
    --card:#ffffff;
    --text:#1b1f2a;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", Roboto, Arial, sans-serif;
    font-size:14px; line-height:1.5;
  }
  .wrap { max-width:820px; margin:0 auto; padding:32px 20px 60px; }
  header.top { margin-bottom:28px; }
  header.top h1 { font-size:21px; margin:0 0 4px; color:var(--navy); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header.top p.sub { margin:0; color:var(--gray); font-size:13px; }
  .brand-lockup { display:inline-flex; align-items:center; gap:8px; flex-shrink:0; }
  .brand-lockup svg { display:block; }
  .brand-film { font-weight:900; font-size:18px; color:#111; letter-spacing:-0.5px; }
  .brand-divider { width:1px; height:20px; background:var(--border); }
  .brand-gm-block { display:flex; flex-direction:column; align-items:flex-start; line-height:1; gap:2px; }
  .brand-gm-word { font-family:"Segoe Script","Brush Script MT","Snell Roundhand",cursive; font-weight:700; font-style:italic; font-size:18px; color:#4a2a16; }
  .brand-gm-tag { font-size:6.5px; font-weight:700; letter-spacing:.3px; color:#fff; background:#3a2213; padding:1px 5px; border-radius:8px; white-space:nowrap; }

  section.card {
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px; margin-bottom:20px;
  }
  section.card h2 { font-size:15px; margin:0 0 4px; color:var(--navy); }
  section.card p.desc { margin:0 0 14px; color:var(--gray); font-size:12.5px; }

  ul.report-list { list-style:none; padding:0; margin:0; }
  ul.report-list li { margin-bottom:10px; }
  ul.report-list li:last-child { margin-bottom:0; }
  a.report-link {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 16px; background:var(--gray-l); border:1px solid var(--border); border-radius:10px;
    color:var(--navy); text-decoration:none; font-weight:700; font-size:14px;
    transition:.15s;
  }
  a.report-link:hover { background:var(--blue-l); border-color:#cfe0fb; color:var(--blue); }
  a.report-link .date-pill {
    display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px;
    background:var(--navy); color:#fff; font-size:12px; font-weight:700; margin-right:10px;
  }
  a.report-link .title-text { flex:1; }
  a.report-link .arrow { color:var(--gray); font-weight:400; font-size:13px; }

  footer.note { color:var(--gray); font-size:11.5px; line-height:1.7; padding-top:6px; }
</style>
</head>
<body>
<div class="wrap">

</body></html>
